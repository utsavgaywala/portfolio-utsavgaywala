                            <span></span>

                        </div>

                            <span>—</span>
                            <span>□</span>

                    </div>

                    <div class="contact-form-wrapper">
                        <p class="transmit-info">
                            Transmitting data to: <span class="email-highlight">utsavgaywala.work@gmail.com</span>
                        </p>

                        <!-- Form Status Message in Window Style -->
                        <div id="form-status-window" class="status-window" style="display: none;">
                            <div class="window-header">
                                <div class="window-dots">
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                </div>
                                <div class="window-title">TRANSMISSION_STATUS</div>
                                <div class="window-controls">
                                    <span>—</span>
                                    <span>□</span>
                                </div>

                        </div>

                        <form class="contact-form" id="contact-form" action="https://api.web3forms.com/submit"

                            <!-- Web3Forms Access Key -->
                            <input type="hidden" name="access_key" value="f90bb33b-a200-4834-b44b-92503cbf5320">
                            <input type="hidden" name="subject" value="New Contact Form Submission from Portfolio">
                            <input type="hidden" name="from_name" value="Portfolio Contact Form">

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="name" class="form-label">USER_ID</label>
                                    <input type="text" id="name" name="name" class="form-input" placeholder="Name"
                                        required />
                                </div>

                                <div class="form-group">
                                    <label for="email" class="form-label">RETURN_PATH</label>
                                    <input type="email" id="email" name="email" class="form-input" placeholder="Email"
                                        required />
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="message" class="form-label">DATA_PACKET</label>
                                <textarea id="message" name="message" class="form-textarea"
                                    placeholder="Type your message..." rows="8" required></textarea>
                            </div>

                            <button type="submit" class="submit-btn" id="submit-btn">
                                <span class="btn-text">TRANSMIT_MESSAGE</span>
                                <span class="btn-loader" style="display: none;">
                                    <span class="loader-dot"></span>
                                    <span class="loader-dot"></span>
                                    <span class="loader-dot"></span>
                                </span>
                            </button>
